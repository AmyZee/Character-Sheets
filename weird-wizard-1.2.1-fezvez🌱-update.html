//Source: https://stackoverflow.com/questions/36127648/uploading-a-json-file-and-using-it
	function importJsonAsObject(){
		var files = document.getElementById('library-import').files;
		// console.log(files);
		if (files.length <= 0) {
			return false;
		}
  
		var fr = new FileReader();
  
		fr.onload = function(e) { 
		// console.log(e);
			var result = JSON.parse(e.target.result);
			var formatted = JSON.stringify(result, null, 2);
			// document.getElementById('JSON-import').innerHTML = formatted;
			unlockedContent = result

			contentPack = unlockedContent.Content == "Novice" ? contentPack = 1 :
			unlockedContent.Content == "Core" ? contentPack = 2 :
			unlockedContent.Content == "Weird Ancestries" ? contentPack = 3 :
			contentPack = 0


		}
  
		fr.readAsText(files.item(0));
	}
