<!DOCTYPE html>
<html>
<head>
<title>Fala</title>
<style>
body{
	background-image: url("13th_Age_Map.jpg");
	background-size: 115%;
	background-position: 5% 25%;
}
#middle{
	position: absolute;
	left: 0px;
	top: 0px;
	width: 360px;
	height: 600px;
	margin: 2em;
	background: rgba(20,20,20,0.95);
	color: white;
	border-radius: 0.5em;
	border: 2px solid rgb(255, 201, 129);
}
h1{
	margin: 1em 1em 0.5em 1em;
	font-variant: small-caps;
	color: rgb(255, 201, 129);
	border-bottom: 1px solid rgb(255, 201, 129);
	font-size: 24px;
}
h2{
	margin: 1em 1em 0.5em 32px;
	color: rgb(255, 201, 129);
	border-bottom: 1px solid rgb(255, 201, 129);
}
p{
	margin: 0 2em 0.5em 2em;
}
#right{
	position: absolute;
	right: 0px;
	top: 0px;
	width: 260px;
	height: 600px;
	margin: 2em;
	background: rgba(255, 201, 129, 0.8);
	border-radius: 0.5em;
	border: 2px solid black;
}
#actionbar{
	background: rgba(20, 20, 20, 0.95);
	position: absolute;
	bottom: 0;
	left: 0;
	height: 90px;
	width: 100%;
	border-top: 2px solid rgba(255, 201, 129, 0.8);
}
#actionbar-1{
	position: fixed;
	bottom: 0;
	left: 100px;
}
#actionbar-2{
	position: fixed;
	bottom: 0;
	left: 200px;
}
#actionbar-3{
	position: fixed;
	bottom: 0;
	left: 300px;
}
#actionbar-4{
	position: fixed;
	bottom: 0;
	left: 400px;
}
#actionbar-5{
	position: fixed;
	bottom: 0;
	left: 500px;
}
#actionbar-6{
	position: fixed;
	bottom: 0;
	left: 600px;
}
#actionbar-7{
	position: fixed;
	bottom: 0;
	left: 700px;
}
#actionbar-8{
	position: fixed;
	bottom: 0;
	left: 800px;
}
#actionbar-9{
	position: fixed;
	bottom: 0;
	left: 900px;
}
#actionbar-10{
	position: fixed;
	bottom: 0;
	left: 1000px;
}
#actionbar-11{
	position: fixed;
	bottom: 0;
	left: 1100px;
}
#actionbar-12{
	position: fixed;
	bottom: 0;
	left: 1200px;
}
</style>
</head>
<body>
<div id="top">
</div>
<div id="middle">
</div>
<div id="right">
	<p>HP: 30/30</p>
</div>
<div id="actionbar"></div>
<div id="actionbar-1">
	<img src="curvy-knife.png" width="80">
</div>
<div id="actionbar-2">
	<img src="spinning-blades.png" width="80">
</div>
<div id="actionbar-3">
	<p>Pull It<br>Together!</p>
</div>
<div id="actionbar-4">
	<p>Stay<br>Strong!</p>
</div>
<div id="actionbar-5">
	<p>We Need<br>You!</p>
</div>
<div id="actionbar-6">
</div>
<div id="actionbar-7">
	<p>Song of<br>Heroes</p>
</div>
<div id="actionbar-8">
	<p>Song of<br>Split Blood</p>
</div>
<div id="actionbar-9">
	<img src="polar-star.png" width="80">
</div>
<div id="actionbar-10">
</div>
<div id="actionbar-11">
</div>
<div id="actionbar-12">
	<img src="heavy-arrow.png" width="80">
</div>
<script>

var lethalUsed = false
var songOfHeroesUsed = false
var songOfSplitBlood = false
var blessUsed = false


document.getElementById("actionbar-1").addEventListener("mouseover", function(){
	document.getElementById("middle").innerHTML = `
		<h1>Basic Melee Attack</h1>
		<p><b>Twin Daggers</b> +5 vs AC <i>(Reroll natural 2)</i></p>
		<p>&nbsp;&nbsp;Hit: 1d4 + 4 damage</p>
		<p>&nbsp;&nbsp;Miss: 1 damage</p>
		<h2>Flexible Attacks</h2>
		<p>Lethal</p>
		<p><b>Natural 11+:</b> Pull It Together!</p>
		<p><b>Natural 16+:</b> Stay Strong!</p>
		<p><b>Natural even:</b> We Need You!</p>
	`
}, false)

document.getElementById("actionbar-2").addEventListener("mouseover", function(){
	document.getElementById("middle").innerHTML = `
		<h1>Lethal</h1>
		<p>Once per battle, reroll a melee attack and use the roll you prefer as the result.</p>
	`
}, false)

document.getElementById("actionbar-2").addEventListener("click", function(){
	if(lethalUsed == false){
		lethalUsed = true
		document.getElementById("actionbar-2").innerHTML = `
			<img src="spinning-blades-used.png" width="80">
		`
	} else {
		lethalUsed = false
		document.getElementById("actionbar-2").innerHTML = `
			<img src="spinning-blades.png" width="80">
		`
	}
	
}, false)

document.getElementById("actionbar-3").addEventListener("mouseover", function(){
	document.getElementById("middle").innerHTML = `
		<h1>Pull It Together!</h1>
		<p>Flexible melee attack</p>
		<p>Triggering Roll: Natural 11+; use only twice per battle</p>
		<p>Effect: One nearby ally can heal using a recovery.</p>
	`
}, false)

document.getElementById("actionbar-4").addEventListener("mouseover", function(){
	document.getElementById("middle").innerHTML = `
		<h1>Stay Strong!</h1>
		<p>Flexible melee attack</p>
		<p>Triggering Roll: Natural 16+</p>
		<p>Effect: Give a nearby ally a +2 bonus to AC until the start of your next turn.</p>

	`
}, false)

document.getElementById("actionbar-5").addEventListener("mouseover", function(){
	document.getElementById("middle").innerHTML = `
		<h1>We Need You!</h1>
		<p>Flexible melee attack</p>
		<p>Triggering Roll: Natural even hit</p>
		<p>Effect: A nearby conscious ally can roll a save against a save ends effect.</p>
	`
}, false)

document.getElementById("actionbar-6").addEventListener("mouseover", function(){
	document.getElementById("middle").innerHTML = `
		<h1>&nbsp;</h1>
	`
}, false)

document.getElementById("actionbar-7").addEventListener("mouseover", function(){
	document.getElementById("middle").innerHTML = `
		<h1>Song of Heroes</h1>
		<p>Bardic song</p>
		<p>Recharge: 11+ after battle</p>
		<p>Quick action each turn; 11+ to sustain</p>
		<p>Opening & Sustained Effect: You and your nearby allies gain a +1 attack bonus until the start of your next turn.</p>
		<p>Final Verse: The effect ends immediately, but one ally of your choice gains a +2 bonus to their next attack roll this battle.</p>
	`
}, false)

document.getElementById("actionbar-8").addEventListener("mouseover", function(){
	document.getElementById("middle").innerHTML = `
		<h1>Song of Split Blood</h1>
		<p>Bardic song</p>
		<p>Daily</p>
		<p>Quick action each turn; 6+ to sustain</p>
		<p>Opening & Sustained Effect: Any attack against you takes a penalty equal to the number of your allies in the battle who have more hit points than you.</p>
		<p>Final Verse: The effect ends immediately, and you or one ally of your choice can heal using a recovery.</p>
	`
}, false)

document.getElementById("actionbar-9").addEventListener("click", function(){
	if(blessUsed == false){
		blessUsed = true
		document.getElementById("actionbar-9").innerHTML = `<img src="polar-star-used.png" width="80">`
	} else {
		blessUsed = false
		document.getElementById("actionbar-9").innerHTML = `<img src="polar-star.png" width="80">`
	}
}, false)

document.getElementById("actionbar-9").addEventListener("mouseover", function(){
	document.getElementById("middle").innerHTML = `
		<h1>Bless</h1>
		<p>Ranged spell; Daily</p>
		<p>Quick action</p>
		<p>Cast for power: One nearby ally gains a +2 attack bonus until the end of the battle.</p>
		<p>Cast for broad: Choose up to three nearby creatures (including you); each target gains a +1 attack bonus until the end of the battle.</p>
	`
}, false)

document.getElementById("actionbar-10").addEventListener("mouseover", function(){
	document.getElementById("middle").innerHTML = `
		<h1>&nbsp;</h1>
	`
}, false)

document.getElementById("actionbar-11").addEventListener("mouseover", function(){
	document.getElementById("middle").innerHTML = `
		<h1>&nbsp;</h1>
	`
}, false)

document.getElementById("actionbar-12").addEventListener("mouseover", function(){
	document.getElementById("middle").innerHTML = `
		<h1>Basic Ranged Attack</h1>
		<p><b>Hand Crossbow</b> +5 vs AC</p>
		<p>&nbsp;&nbsp;<b>Hit:</b> 1d4 + 4 damage</p>
		<p>&nbsp;&nbsp;<b>Miss:</b> --</p>
	`
}, false)


</script>
</body>
</html>


	<!--
	- Basic Melee Attack
		- Lethal (reroll, use preferred, 1x/battle)
		- Pull it Together! (nat 11+, 2x/battle)
		- Stay Strong! (nat 16+)
		- We Need You! (nat even)
	- Pull it Together! Standard
	- Stay Strong! Standard
	- We Need You! Standard
	- Song of Heroes (recharge 11+, sustain 11+)
	- Song of Split Blood (daily, sustain 6+)
	- Bless (daily)
	- Basic Ranged Attack
	-->
